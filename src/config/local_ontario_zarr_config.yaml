lake: ontario
environment: local

paths:
  data_cache: ~/dev/deepsensor_projects/ontario_test/data_cache
  raw_dir: ~/dev/deepsensor_projects/ontario_test/data_cache/raw
  processed_dir: ~/dev/deepsensor_projects/ontario_test/data_cache/processed
  model_dir: ~/dev/deepsensor_projects/ontario_test/data_cache/saved_models

data_sources:
  sst:
    path: ~/dev/deepsensor_projects/data/greatlakes_raw_temporal_ds_inputs/GLSEA_GCS_SST.zarr
    format: zarr
    variable: sst
  bathy:
    path: ~/dev/deepsensor_projects/data/bathy/gl_bathy_depth_3arcsec_clean.nc
    format: netcdf
    variable: z
  lake_mask:
      path: ~/dev/deepsensor_projects/data/bathy/gl_landmask_3arcsec.nc
      format: netcdf
      variable: mask
  dist_to_land:
    path: ~/dev/deepsensor_projects/data/bathy/gl_dist_to_land_3arcsec.nc
    format: netcdf
    variable: dist_to_land
  core_depth:
    path: ~/dev/deepsensor_projects/data/bathy/gl_core_depth_3arcsec.nc
    format: netcdf
    variable: core_depth
  era5:
    path: ~/dev/deepsensor_projects/data/greatlakes_raw_temporal_ds_inputs/era5_vars.zarr
    format: zarr
    variables: [t2m_daily_mean, ssr_daily_sum, u10_daily_mean, v10_daily_mean]
  ice_concentration:
     path: ~/dev/deepsensor_projects/data/greatlakes_raw_temporal_ds_inputs/GL_Ice_Concentration_GCS.zarr
     format: zarr
     variable: ice_concentration

preprocessing:
  static_coarsen_factor: 10
  mask_coarsen_factor: 20
  fit_range: ["2019-01-01", "2019-12-31"]
  force_reprocess: false

training:
  train_range: ["2019-01-01", "2020-12-31"]
  val_range: ["2021-01-01", "2021-12-31"]
  date_subsample_factor: 5
  n_epochs: 25
  lr: 5.0e-5
  internal_density: 50
  n_context_points: 50
  vary_n_context: true
  min_n_context: 5
  max_n_context: 50
  include_bathy_as_context: false
  bathy_context_sampling: 'all' #random_lake_points  # or: all, or: 1000

run:
  name: run08_test
  notes: "testing_dtype_lik kwargs"