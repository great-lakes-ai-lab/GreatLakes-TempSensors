# /src/config/config_template_local.yaml

run:
  name: default_run
  notes: "This is a template config yaml. Make a copy of it and rename it "
  display_plots: save_only  # "auto", "show", or "save_only" Just keep it on save_only unless debugging and looking at plots live

lake: michigan

paths:
  output_root: ~/dev/deepsensor_projects/runs/

data_sources:
  sst:
    path: /Users/jagraha/dev/deepsensor_projects/data/temporal_inputs/glsea_sst.zarr  # The path to the data input
#    path: /Users/jagraha/dev/deepsensor_projects/data/temporal_inputs/glsea3_sst.zarr  # The path to the data input
    format: zarr  # netcdf or zarr
    role: target  # target, context, aux_at_target. Use list for multiple
    use_anomalies: true  # This will trigger the seasonal cycle processor and compute the anomalies rather than direct values
    sampling: random_lake_points  # random_lake_points: will use the randomly generated N context points, all: uses all points
    variable: sst
    fill_values: []
  era5:
    path: /Users/jagraha/Data/ciglr_globus/greatlakes_era5_1995_2025.zarr
    format: zarr
    variables: [t2m_daily_mean, ssr_daily_sum, u10_daily_mean, v10_daily_mean ]
    role: context
    sampling: all
    fill_values: []
  ice_concentration:
    path: /Users/jagraha/dev/deepsensor_projects/data/temporal_inputs/ice_concentration.zarr
    format: zarr
    variable: ice_concentration
    role: context
    sampling: all
    fill_values: []
  bathy:
    path: ~/dev/deepsensor_projects/data/bathy/gl_bathy_depth_3arcsec_clean.nc
    format: netcdf
    variable: z
    role: [context, aux_at_targets]
    sampling: all
    coarsen_factor: 10
    fill_values: []
  lake_mask:
      path: ~/dev/deepsensor_projects/data/bathy/gl_landmask_3arcsec.nc
      format: netcdf
      variable: mask
      role: mask
      coarsen_factor: 25
      fill_values: []
  dist_to_land:
    path: ~/dev/deepsensor_projects/data/bathy/gl_dist_to_land_3arcsec.nc
    format: netcdf
    variable: dist_to_land
    role: [context, aux_at_targets]
    coarsen_factor: 10
    fill_values: []
  core_depth:
    path: ~/dev/deepsensor_projects/data/bathy/gl_core_depth_3arcsec.nc
    format: netcdf
    variable: core_depth
    role: [context, aux_at_targets]
    coarsen_factor: 10
    fill_values: []

preprocessing:
  fit_range: # Now inherits from train range following andersson et al 2023. Can override by entering dates eg["2019-01-01", "2019-12-31"]  # This is the range of data that will be used to set up the dataprocessor for scaling the data
  force_reprocess: True  # If true data will be reprocessed each time the pipeline runs
  climatology_method: harmonic   # monthly | daily_doy | harmonic
  n_harmonics: 3   # for harmonics only
  smooth_window: 15  # for daily_doy only

training:
  train_range: ["2018-01-01", "2020-12-31"] # The range of data exposed to the model for training
  val_range: ["2021-01-01", "2022-12-31"] # The range of data exposed for validation

  # --- Date selection ---
  resample_dates_per_epoch: true  # Also draw fresh dates from teh full train range each epoch, Requires resample_tasks_epoch to be true and train_date_mode to be random
  train_date_mode: random     # "strided" (fixed every-Nth-day set) or "random" (fresh draw each epoch)
  train_date_stride: 20       # mode=strided only: every Nth day; guarantees a min N-day gap between tasks
  train_date_fraction: 0.05   # mode=random only: fraction of all daily dates in train_range drawn per epoch
  n_train_dates_per_epoch:    # mode=random only: blank/null -> use fraction; set an int to pin the count
  val_date_stride: 20         # Stride for validation dates. Always deterministic (same set every epoch)

  # --- Context sampling ---
  resample_tasks_per_epoch: true  # Regenerate context points each epoch (Andersson-style). If false, one fixed task set is reused.
  n_context_points: 60  # The number of context points used for a training/validation task. Ignored if vary_n_context is False
  vary_n_context: true  # Whether or not to vary the number of context sampling points for task training/validation
  min_n_context: 10  # If vary_n_context is true, then the lowest possible random number of context points
  max_n_context: 200  # If vary_n_context is true, then the highest possible random number of context points
  train_task_seed: 1000  # Per-epoch task seed = train_task_seed + epoch. Change for a different resampling stream.

  # --- Optimization ---
  n_epochs: 4  # How many epochs the training loop will go for
  lr: 5.0e-5  # The learning rate. This is the default
  patience: 15  # Number of training iterations with no improvement before early exit of training
  internal_density: 75  # The density of the internal grid that all data gets processed into. The higher the value the higer the spatial resolution of the outputs but also increases computational overhead


prediction:
  # Option 1: Specific dates
  dates: ["2021-03-15", "2021-06-01", "2021-07-15", "2021-10-01", "2022-03-15", "2022-06-01", "2022-07-15", "2022-10-01"]

  # Option 2: Random sample from val range
