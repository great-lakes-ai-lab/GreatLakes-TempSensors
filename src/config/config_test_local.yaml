preprocessing:
  fit_range: ["2017-01-01", "2019-12-31"]  # This is the range of data that will be used to set up the dataprocessor for scaling the data
  force_reprocess: false

training:
  train_range: ["2018-01-01", "2021-12-31"] # The range of data exposed to the model for training
  val_range: ["2022-01-01", "2023-12-31"] # The range of data exposed for validation
  date_subsample_factor: 60
  n_epochs: 10
  lr: 5.0e-5
  patience: 15
  internal_density: 50
  n_context_points: 60
  vary_n_context: true
  min_n_context: 10
  max_n_context: 200


prediction:
  # Option 1: Specific dates
  dates: ["2021-03-15", "2021-06-01", "2021-07-15", "2021-10-01", "2022-03-15", "2022-06-01", "2022-07-15", "2022-10-01"]

