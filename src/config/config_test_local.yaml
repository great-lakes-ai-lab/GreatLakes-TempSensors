  sst:
    path: /Users/jagraha/dev/deepsensor_projects/data/temporal_inputs/glsea3_sst.zarr
    format: zarr
    role: target
    use_anomalies: true
    sampling: random_lake_points
    variable: sst
    fill_values: []
  era5:
    path: /Users/jagraha/Data/ciglr_globus/greatlakes_era5_1995_2025.zarr
    format: zarr
    variables: [t2m_daily_mean, ssr_daily_sum, u10_daily_mean, v10_daily_mean]
    role: context
    sampling: all
    fill_values: []
