  notes: "Checking that the data for the whole temporal exten (glsea3) t goes through before moving to HPC"
  display_plots: save_only  # "auto", "show", or "save_only"

lake: superior

paths:
  output_root: ~/dev/deepsensor_projects/runs/

data_sources:
  sst:
    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/temporal/glsea_sst.zarr  # GLSEA (1996-2023)
#    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/temporal/glsea3_sst.zarr  # GLSEA3 (2007-current)
    format: zarr
    role: target
    use_anomalies: true
    sampling: random_lake_points
    variable: sst
  era5:
    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/temporal/greatlakes_era5_1995_2025.zarr
    format: zarr
    variables: [t2m_daily_mean]
    role: context
    sampling: all
