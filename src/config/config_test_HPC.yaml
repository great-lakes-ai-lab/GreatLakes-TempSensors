run:
  name: run00_HPC_config_test
  notes: "Checking that the data for the whole temporal exten (glsea3) t goes through before moving to HPC"
  display_plots: save_only  # "auto", "show", or "save_only"

lake: superior

paths:
  output_root: /scratch/dannes_root/dannes0/jagraha/ds_runs

data_sources:
  sst:
#    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/temporal/glsea_sst.zarr  # GLSEA (1996-2023)
    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/temporal/glsea3_sst.zarr  # GLSEA3 (2007-current)
    format: zarr
    role: target
    use_anomalies: true
    sampling: random_lake_points
    variable: sst
    fill_values: [0.2]
  era5:
    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/temporal/greatlakes_era5_1995_2025.zarr
    format: zarr
    variables: [t2m_daily_mean]
    role: context
    sampling: all
    fill_values: []
  ice_concentration:
    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/temporal/ice_concentration.zarr
    format: zarr
    variable: ice_concentration
    role: context
    sampling: all
    fill_values: []
  bathy:
    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/bathymetry/gl_bathy_depth_3arcsec_clean.nc
    format: netcdf
    variable: z
    role: [context, aux_at_targets]
    sampling: all
    coarsen_factor: 10
    fill_values: []
  lake_mask:
      path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/bathymetry/gl_landmask_3arcsec.nc
      format: netcdf
      variable: mask
      role: mask
      coarsen_factor: 25
      fill_values: []
  dist_to_land:
    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/bathymetry/gl_dist_to_land_3arcsec.nc
    format: netcdf
    variable: dist_to_land
    role: [context, aux_at_targets]
    coarsen_factor: 10
    fill_values: []
  core_depth:
    path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/bathymetry/
    format: netcdf
    variable: core_depth
    role: [context, aux_at_targets]
    coarsen_factor: 10
    fill_values: []

preprocessing:
  # Normalization statistics and the seasonal climatology are fit here.
  # ENFORCED: fit_range must sit wholly inside train_range — otherwise val/test
  # statistics leak into the model. Setting it equal to train_range is the
  # default recommendation.
  fit_range: # Now inherits from train range following andersson et al 2023. Can override by entering dates eg["2019-01-01", "2019-12-31"]  # This is the range of data that will be used to set up the dataprocessor for scaling the data
  force_reprocess: false  # If true data will be reprocessed each time the pipeline runs
  # Seasonal Climatology
  climatology_method: harmonic   # monthly | daily_doy | harmonic
  n_harmonics: 3   # for harmonics only
  smooth_window: 7  # for daily_doy only

training:
  # train / val / test must be mutually disjoint (enforced) and each span
  # >= 1 full year (warned) so seasonal coverage is complete.
  #   train -> gradient updates
  #   val   -> checkpoint selection / early stopping
  #   test   > held out; scored once by the `evaluate` stage
  train_range: [["2025-01-01", "2025-12-31"]] # The range of data exposed to the model for training
  val_range: [["2024-01-01", "2024-12-31"]] # The range of data exposed for validation
  test_range: [["2023-01-01", "2023-12-31"]]
  train_months_drop: [ 12, 1, 2, 3 ]
  val_months_drop: [ 12, 1, 2, 3 ]
  test_months_drop: [ 12, 1, 2, 3, 4, 11 ]

  # --- Date selection ---
  train_date_mode: random     # "strided" (fixed every-Nth-day set) or "random" (fresh draw each epoch)
  train_date_stride: 20       # mode=strided only: every Nth day; guarantees a min N-day gap between tasks
  train_date_fraction: 0.10   # mode=random only: fraction of all daily dates in train_range drawn per epoch
  n_train_dates_per_epoch:   # mode=random only: blank/null -> use fraction; set an int to pin the count
  val_date_stride: 21         # Stride for validation dates. Always deterministic (same set every epoch)
  use_train_monitor: true
  train_monitor_interval: 3

  # --- Context sampling ---
  resample_tasks_per_epoch: true  # Regenerate context points each epoch (Andersson-style). If false, one fixed task set is reused.
  n_context_points: 60  # The number of context points used for a training/validation task. Ignored if vary_n_context is False
  vary_n_context: true  # Whether or not to vary the number of context sampling points for task training/validation
  min_n_context: 5  # If vary_n_context is true, then the lowest possible random number of context points
  max_n_context: 50  # If vary_n_context is true, then the highest possible random number of context points
  train_task_seed: 1000  # Per-epoch task seed = train_task_seed + epoch. Change for a different resampling stream.

  # --- Task Context Point
  active_buoy_points_path: /nfs/turbo/seas-dannes/SST-sensor-placement-input/pipeline_inputs/buoy_locations/actual_erie_2025.geojson
  train_tasks_fully_random: 0.4
  train_tasks_active_plus_random: 0.25
  train_tasks_subset_active_plus_random: 0.3
  train_tasks_active_only: 0.05
  train_tasks_per_date: 1.2  # Average tasks generated per date (>1.0 lets some dates contribute to multiple sampling modes); only applied when task_ratios is set.


  # --- Optimization ---
  n_epochs: 8  # How many epochs the training loop will go for
  lr: 1.0e-4  # The learning rate. This is the default=5.0e-5
  patience: 30  # Number of training iterations with no improvement before early exit of training
  # --- Model Specification ----
  internal_density: 150  # The density of the internal grid that all data gets processed into. The higher the value the higer the spatial resolution of the outputs but also increases computational overhead
  n_unet_layers: 4
  unet_kernel_size: 5
  unet_channels: 64  # Not going to mess with the default for now
  # --- Model Dev Plots. Applies only to preview mode
  internal_density_sweep: [50, 100, 200, 300, 500]
  n_unet_layer_sweep: [4, 6]
  unet_kernel_size_sweeep: [3,5]

evaluation:
  name: default
  split: test                # Held-out split to score on. Use "val" while developing.
  date_subsample_factor: 14    # Stride over the split range. 7 = weekly.
  n_context_sweep: [10, 20, 40] # [5, 10, 25, 50, 100]  # RMSE is meaningless without stating n_context
  seeds: [0, 16, 33]            # Random context placements; spread = baseline envelope for AL
  compare_active: true         # uses training.active_buoy_points_path


prediction:
  # Which split the prediction dates are drawn from. Outputs land in
  # predictions/<split>/ so val sanity-checks never overwrite test figures.
  split: val
  # Option 1: Specific dates
  dates: ["2021-03-15", "2021-06-01", "2021-07-15", "2021-10-01", "2022-03-15", "2022-06-01", "2022-07-15", "2022-10-01"]

  # Option 2: Random sample from val range
#  n_random: 10
#  seed: 42
#
#   Option 3: Every n days across val range
#  every_n_days: 30

  # Option 4: Override context points for prediction
#  every_n_days: 30
#  n_context: 50
