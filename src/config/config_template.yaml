run:
  name: default_run
  notes: "This is a template config yaml. Make a copy of it and rename it "
  display_plots: save_only  # "auto", "show", or "save_only" Just keep it on save_only unless debugging and looking at plots live

lake: michigan

paths:
  output_root: ~/dev/deepsensor_projects/runs/

data_sources:
  sst:
    path: /Users/jagraha/dev/deepsensor_projects/data/temporal_inputs/glsea_sst.zarr  # The path to the data input
    format: zarr  # netcdf or zarr
    role: target  # target, context, aux_at_target. Use list for multiple
    use_anomalies: true  # This will trigger the seasonalcyle processer and compute the anomalies rather than direct values
    sampling: random_lake_points  # random_lake_points: will use the randomly generated N context points, all: uses all points
    variable: sst
  era5:
    path: /Users/jagraha/Data/ciglr_globus/greatlakes_era5_1995_2025.zarr
    format: zarr
    variables: [t2m_daily_mean, ssr_daily_sum, u10_daily_mean, v10_daily_mean ]
    role: context
    sampling: all
  ice_concentration:
    path: /Users/jagraha/dev/deepsensor_projects/data/temporal_inputs/ice_concentration.zarr
    format: zarr
    variable: ice_concentration
    role: context
    sampling: all
  bathy:
    path: ~/dev/deepsensor_projects/data/bathy/gl_bathy_depth_3arcsec_clean.nc
    format: netcdf
    variable: z
    role: [context, aux_at_targets]
    sampling: all
    coarsen_factor: 10
  lake_mask:
      path: ~/dev/deepsensor_projects/data/bathy/gl_landmask_3arcsec.nc
      format: netcdf
      variable: mask
      role: mask
      coarsen_factor: 25
  dist_to_land:
    path: ~/dev/deepsensor_projects/data/bathy/gl_dist_to_land_3arcsec.nc
    format: netcdf
    variable: dist_to_land
    role: [context, aux_at_targets]
    coarsen_factor: 10
  core_depth:
    path: ~/dev/deepsensor_projects/data/bathy/gl_core_depth_3arcsec.nc
    format: netcdf
    variable: core_depth
    role: [context, aux_at_targets]
    coarsen_factor: 10

preprocessing:
  fit_range: ["2019-01-01", "2019-12-31"]  # This is the range of data that will be used to set up the dataprocessor for scaling the data
  force_reprocess: False  # If true data will be reprocessed each time the pipeline runs

training:
  train_range: ["2018-01-01", "2020-12-31"] # The range of data exposed to the model for training
  val_range: ["2021-01-01", "2022-12-31"] # The range of data exposed for validation
  date_subsample_factor: 20  # Every X days for sampling. The lower the value the higher the number of training and validation tasks
  n_epochs: 60  # How many epochs the training loop will go for
  lr: 5.0e-5  # The learning rate. This is the default
  patience: 15  # Number of training iterations with no improvement before early exit of training
  internal_density: 250  # The density of the internal grid that all data gets processed into. The higher the value the higer the spatial resolution of the outputs but also increases computational overhead
  n_context_points: 60  # The number of context points used for a training/validation task. Ignored if vary_n_context is False
  vary_n_context: true  # Whether or not to vary the number of context sampling points for task training/validation
  min_n_context: 10  # If vary_n_context is true, then the lowest possible random number of context points
  max_n_context: 200  # If vary_n_context is true, then the highest possible random number of context points


prediction:
  # Option 1: Specific dates
  dates: ["2021-03-15", "2021-06-01", "2021-07-15", "2021-10-01", "2022-03-15", "2022-06-01", "2022-07-15", "2022-10-01"]

  # Option 2: Random sample from val range
#  n_random: 10
#  seed: 42
#
#   Option 3: Every n days across val range
#  every_n_days: 30

  # Option 4: Override context points for prediction
#  every_n_days: 30
#  n_context: 50

active_learning:
  # Active learning experiment name (creates subfolder)
  name: al_stddev_50ctx_20km

  # Dates over which to evaluate candidate sensor locations
  eval_range: ["2021-06-01", "2022-08-31"]
  eval_subsample_factor: 15   # every N days

  # Number of new buoy/sensor locations to recommend
  n_new_sensors: 10

  # Sequential (non-parallel) options:
  #   mean_stddev, mean_variance, mean_marginal_entropy, joint_entropy,
  #   p_norm_stddev, oracle_rmse, oracle_mae, oracle_marginal_nll, oracle_joint_nll
  #
  # Parallel options:
  #   stddev, context_dist, expected_improvement, random
  #
  # NOTE: If a parallel acquisition function is chosen, then
  #       target_coarsen_factor must equal candidate_coarsen_factor.
  acquisition_function: stddev

  # Function-specific parameters:
  #   acquisition_fn_p: p-norm exponent (only used by p_norm_stddev)
  #     p=1 → mean absolute uncertainty
  #     p=2 → emphasizes larger uncertainties
  #     p≥5 → aggressively targets worst-predicted regions
  #   acquisition_fn_seed: random seed (only used by random)
  acquisition_fn_p: 2.0
  acquisition_fn_seed: 42


  # Candidate/search grid controls
  # NOTE: If one of the parallel acquistion functions is chose then target coarsen must == candidate coarsen
  candidate_coarsen_factor: 1   # coarsen search grid for speed
  target_coarsen_factor: 1      # coarsen objective/target grid for speed

  # Context construction for active learning tasks
  # Context point source for active learning tasks
  # Options:
  #   "random"  - generate N random lake points (default, current behavior)
  #   "geojson" - load fixed points from a GeoJSON file
  #   "buoy"    - load from buoy observation NetCDF (future)
  context_source: random

 # For random: number of points to generate
  n_context: 8
  context_seed: 42
  save_context_points: true # Save generated context points (only applies to "random")

  # For geojson: path to file with Point features
  context_geojson_path: null
#  context_geojson_path:


  # Not sure what these are but they are the defaults into the greedy algorithm
  context_set_idx: 0
  target_set_idx: 0

  # GreedyAlgorithm options
  model_infill_method: mean
  diff: false
  progress_bar: true

  # Spacing constraints
  min_dist_between_sensors_km: 10.0

  # Optional future hook: existing buoy locations to avoid/reuse
#  existing_sensors_path: /Users/jagraha/dev/deepsensor_projects/data/buoy/pretend_locations/fake_erie_buoy_points_2_shoreline.geojson
  existing_sensors_path: null

  # Outputs
  save_acquisition_surface: true
  plot_results: true