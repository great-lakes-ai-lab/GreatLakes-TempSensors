lake: erie
environment: local

paths:
  data_cache: ~/dev/deepsensor_projects/refactor_test/lake_erie/data_cache
  raw_dir: ~/dev/deepsensor_projects/refactor_test/lake_erie/data_cache/raw
  processed_dir: ~/dev/deepsensor_projects/refactor_test/lake_erie/data_cache/processed
  model_dir: ~/dev/deepsensor_projects/refactor_test/lake_erie/data_cache/saved_models

data_sources:
  sst:
    path: ~/dev/deepsensor_projects/refactor_test/lake_erie/data_cache/raw/glsea_sst_lake_erie_2019_2021.nc
    format: netcdf
    variable: sst
  bathy:
    path: ~/dev/deepsensor_projects/refactor_test/lake_erie/data_cache/raw/erie_lld.grd
    format: netcdf
    variable: z
  t2m:
    path: ~/dev/deepsensor_projects/refactor_test/lake_erie/data_cache/raw/lake_erie_t2m_daily_mean_2019_2021.nc
    format: netcdf
  ssr:
    path: ~/dev/deepsensor_projects/refactor_test/lake_erie/data_cache/raw/lake_erie_ssr_daily_sum_2019_2021.nc
    format: netcdf
  # ice_concentration:
  #   path: ...
  #   format: netcdf

preprocessing:
  static_coarsen_factor: 10
  mask_coarsen_factor: 20
  fit_range: ["2019-01-01", "2019-12-31"]
  force_reprocess: false

training:
  train_range: ["2019-01-01", "2020-12-31"]
  val_range: ["2021-01-01", "2021-12-31"]
  date_subsample_factor: 5
  n_epochs: 25
  lr: 5.0e-5
  internal_density: 50
  n_context_points: 50
  vary_n_context: true
  min_n_context: 5
  max_n_context: 50
  include_bathy_as_context: false
  bathy_context_sampling: 'all' #random_lake_points  # or: all, or: 1000

run:
  name: run08_test
  notes: "testing_dtype_lik kwargs"